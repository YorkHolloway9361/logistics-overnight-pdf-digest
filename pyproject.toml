[project]
name = "logistics-night-digest"
version = "0.1.0"
description = "Batch-summarise shipment exceptions and render a logistics PDF digest."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
